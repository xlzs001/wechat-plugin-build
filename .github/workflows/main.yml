name: Build Tweak

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Setup Theos and iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/*.sdk ${{ github.workspace }}/theos/sdks
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Build Package
        run: |
          # 自动修复 Windows 产生的回车换行符格式问题
          perl -pi -e 's/\r\n/\n/g' control Makefile WeChatMenuCustomizer.plist || true
          
          make package FINALPACKAGE=1
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/ \; 2>/dev/null || true
          cp packages/*.deb output/ 2>/dev/null || true

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: WeChatMenuCustomizer-Output
          path: output/
