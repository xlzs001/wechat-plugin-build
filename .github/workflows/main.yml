name: Build Tweak

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: theos/theos-action@v1

      - name: Build Package
        run: |
          make package FINALPACKAGE=1
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/ \; 2>/dev/null || true
          cp packages/*.deb output/ 2>/dev/null || true

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: WeChatMenuCustomizer-Output
          path: output/
